name: Serve Site

on: [push , workflow_dispatch]

jobs:
  serve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start server
        run: |
          python3 -m http.server 8080 &
          sleep 5

      - name: Start ngrok
        run: |
         ngrok config add-authtoken 3BmuLJ4IWkIioUUejPh20sROtlV_4cbf4iZcnTibgLr2AkLuz
          ngrok http 8080 &
          sleep 10

      - name: Stay alive
        run: |
          sleep 21000

      - name: Trigger replacement workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          curl -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/serve.yml/dispatches \
          -d '{"ref":"main"}'
