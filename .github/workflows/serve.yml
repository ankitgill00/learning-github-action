name: Public Web Server

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  webserver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ngrok
        run: |
          wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xzf ngrok-v3-stable-linux-amd64.tgz
          chmod +x ngrok
          sudo mv ngrok /usr/local/bin/

      - name: Verify ngrok
        run: |
          which ngrok
          ngrok version

      - name: Configure ngrok
        run: |
          ngrok config add-authtoken 3BmuLJ4IWkIioUUejPh20sROtlV_4cbf4iZcnTibgLr2AkLuz

      - name: Start HTTP Server
        run: |
          nohup python3 -m http.server 8080 > server.log 2>&1 &
          sleep 5

      - name: Start ngrok Tunnel
        run: |
          nohup ngrok http 8080 > ngrok.log 2>&1 &
          sleep 15

      - name: Show Public URL
        run: |
          curl -s http://127.0.0.1:4040/api/tunnels > tunnels.json

          echo "========== TUNNELS =========="
          cat tunnels.json

          URL=$(grep -o 'https://[^"]*' tunnels.json | head -1)

          echo ""
          echo "==========================="
          echo "PUBLIC URL:"
          echo "$URL"
          echo "==========================="

      - name: Run Server For 5h45m
        run: |
          sleep 20700

      - name: Start Replacement Workflow
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/serve.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Wait For New Runner
        run: |
          sleep 900
